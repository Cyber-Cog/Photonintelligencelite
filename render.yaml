# Render Blueprint — PIC Lite API (free tier).
# Deploy: Render Dashboard → New → Blueprint → connect this repo → apply render.yaml.
#
# Region: keep Neon Postgres in the same region as this service (commonly Oregon).
# Cross-region DB round-trips add latency on every login/demo query.
#
# You paste secrets in the Render dashboard (keys marked sync: false). Do not commit them.
# Full connect checklist: docs/deployment.md
#
# Prefer same-origin UI proxy (do NOT set Vercel VITE_API_BASE_URL):
#   vercel.json rewrites /api/* → https://pic-lite-api.onrender.com/api/*
# Set CORS_ORIGINS / PUBLIC_APP_URL to the Vercel / custom domain origin.

services:
  - type: web
    name: pic-lite-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      # --- Fixed free-tier defaults (committed) ---
      - key: PIC_LITE_FREE_TIER
        value: "true"
      - key: JOB_ROOT
        value: /tmp/pic-lite-jobs
      - key: LOG_LEVEL
        value: INFO
      # Cap workers on 512 MB free instances
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      # HTTPS cross-origin (Vercel UI → this API): SameSite=None; Secure cookies
      - key: COOKIE_SECURE
        value: "true"
      # No SMTP on free tier — auto-verify signups (set false if you add SMTP)
      - key: AUTH_AUTO_VERIFY
        value: "true"
      # Keep completed job results for 7 days (not 60 min). Override in dashboard if needed.
      # Note: JOB_ROOT on free tier is ephemeral — a service restart can still wipe files
      # before TTL; Neon job rows remain. Prefer a persistent disk when upgrading plans.
      # Missing raw files are detected and return a re-upload message (no path leak).
      - key: REPORT_TTL_MINUTES
        value: "10080"

      # --- You set these in the Render dashboard (sync: false) ---
      # Neon pooled connection string (postgresql://… is OK — app normalizes to +psycopg)
      - key: DATABASE_URL
        sync: false
      # Exact Vercel origin(s), comma-separated, no trailing slash
      # e.g. https://pic-lite.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Same as the Vercel app URL (used in email/verify links)
      - key: PUBLIC_APP_URL
        sync: false
      # Long random string (e.g. openssl rand -hex 32)
      - key: SESSION_SECRET
        sync: false
      # First superadmin account (created/repaired on API startup)
      - key: PIC_SUPERADMIN_EMAIL
        sync: false
      - key: PIC_SUPERADMIN_PASSWORD
        sync: false
      # Optional:
      # - key: PIC_SUPERADMIN_NAME
      #   value: Superadmin
      # - key: JOB_TIMEOUT_SEC
      #   sync: false
      # Google AI Studio key for parse-assist + AI integrity (preferred).
      # Paste in Render dashboard — see docs/GEMINI-API-SETUP.md
      # - key: GEMINI_API_KEY
      #   sync: false
      # - key: GEMINI_MODEL
      #   value: gemini-flash-latest
      # ZenMux chat key fallback (sk-ai-v1-… or sk-ss-v1-…; NOT sk-mg-v1-…).
      # Paste in Render dashboard — see docs/ZENMUX-API-SETUP.md
      # - key: ZENMUX_API_KEY
      #   sync: false
      # - key: ZENMUX_BASE_URL
      #   value: https://zenmux.ai/api/v1
      # - key: ZENMUX_MODEL
      #   value: google/gemini-2.5-flash
